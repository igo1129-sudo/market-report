name: Daily Market Snapshot

on:
  schedule:
    # 6:50am Singapore time (UTC+8) = 22:50 UTC on the previous day.
    # 只在周一到周五跑（周末海外市场也基本无新收盘价）。
    - cron: '50 22 * * 0-4'
  workflow_dispatch: {}   # 允许手动点击 "Run workflow" 测试

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch indices and build report
        run: python fetch_indices.py

      - name: Commit updated report
        run: |
          git config user.name "market-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report.html indices.json
          git diff --cached --quiet || git commit -m "Daily market snapshot $(date -u +'%Y-%m-%d')"
          git push
